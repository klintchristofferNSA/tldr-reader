name: Daily TLDR Summary

"on":
  schedule:
   - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run TLDR summary
        run: python tldr_summary.py

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: tldr-summary
          path: summary.txt
        
    
